{% extends "base.html" %}

{% block titulo %}
Sesión cerrada - SonoraStudio
{% endblock %}

{% block contenido %}

<style>
    .logout-container {
        max-width: 1240px;
        margin: 55px auto;
    }

    .logout-hero {
        position: relative;
        min-height: 480px;

        border-radius: 8px;
        overflow: hidden;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #333;

        box-shadow:
            0 15px 40px rgba(0, 0, 0, 0.18);
    }

    .logout-image {
        position: absolute;

        width: 100%;
        height: 100%;

        top: 0;
        left: 0;

        object-fit: cover;

        z-index: 1;
    }

    .logout-overlay {
        position: absolute;

        inset: 0;

        background:
            rgba(0, 0, 0, 0.55);

        z-index: 2;
    }

    .logout-card {
        position: relative;

        z-index: 3;

        width: 100%;
        max-width: 470px;

        box-sizing: border-box;

        background:
            rgba(255, 255, 255, 0.97);

        border-radius: 12px;

        padding: 42px;

        text-align: center;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .logout-icon {
        color: #e3a800;

        font-size: 42px;

        margin-bottom: 10px;
    }

    .logout-card h1 {
        color: #171717;

        font-size: 31px;

        margin:
            0 0 12px 0;
    }

    .logout-card p {
        color: #666;

        font-size: 16px;

        line-height: 1.6;

        margin-bottom: 28px;
    }

    .login-button {
        display: block;

        width: 100%;

        box-sizing: border-box;

        background: #e3a800;

        color: #111 !important;

        text-decoration: none;

        padding: 14px;

        border-radius: 7px;

        font-weight: 800;

        margin-bottom: 17px;
    }

    .login-button:hover {
        background: #f2b900;
    }

    .home-link {
        color: #555;

        text-decoration: none;
    }

    .home-link:hover {
        color: #e3a800;
    }
</style>


<div class="logout-container">

    <section class="logout-hero">

        <img class="logout-image" id="sonoraLogoutImage" alt="SonoraStudio Music Store">

        <div class="logout-overlay"></div>


        <div class="logout-card">

            <div class="logout-icon">
                ♪
            </div>


            <h1>
                Sesión cerrada
            </h1>


            <p>
                Has cerrado sesión correctamente en
                SonoraStudio & Guitar Academy.
            </p>


            <a href="/admin/login/" class="login-button">
                Iniciar sesión nuevamente
            </a>


            <a href="/tienda/" class="home-link">
                ← Volver a SonoraStudio
            </a>

        </div>

    </section>

</div>


<script>

    /*
    Buscamos directamente la imagen que YA FUNCIONA
    en la página principal de SonoraStudio.
    */

    fetch("/tienda/")

        .then(function (response) {

            return response.text();

        })

        .then(function (html) {

            const parser =
                new DOMParser();

            const pagina =
                parser.parseFromString(
                    html,
                    "text/html"
                );

            const imagenes =
                pagina.querySelectorAll("img");


            let imagenPrincipal = null;


            for (
                let i = 0;
                i < imagenes.length;
                i++
            ) {

                const src =
                    imagenes[i].getAttribute("src");

                if (src) {

                    const texto =
                        src.toLowerCase();

                    if (
                        texto.includes("tienda") ||
                        texto.includes("sonora") ||
                        texto.includes("music")
                    ) {

                        imagenPrincipal = src;

                        break;

                    }

                }

            }


            if (
                !imagenPrincipal &&
                imagenes.length > 0
            ) {

                imagenPrincipal =
                    imagenes[0]
                        .getAttribute("src");

            }


            if (imagenPrincipal) {

                document
                    .getElementById(
                        "sonoraLogoutImage"
                    )
                    .src =
                    imagenPrincipal;

            }

        });

</script>

{% endblock %}
