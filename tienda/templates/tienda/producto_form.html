{% extends 'base.html' %}

{% block titulo %}{{ titulo }} - SonoraStudio{% endblock %}

{% block encabezado %}{{ titulo }}{% endblock %}

{% block contenido %}

<div class="card">
    <div class="card-body">

        <h2>{{ titulo }}</h2>

        <form method="post" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Guardar
            </button>

            <a href="{% url 'tienda:producto_lista' %}" class="btn btn-secondary">
                Cancelar
            </a>

        </form>

    </div>
</div>

{% endblock %}
